name: Publish signed browser update
on:
  push:
    branches: [main]
    paths: ['manifest.json', 'release-parts/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download committed distribution files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir payload
          for i in 0 1 2 3 4; do
            gh api "repos/$REPO/contents/release-parts/part-$i?ref=$COMMIT" --jq .content | base64 --decode > "payload/part-$i"
          done
          cat payload/part-{0,1,2,3,4} > SPM-Browser-19.9.1.apk
          gh api "repos/$REPO/contents/manifest.json?ref=$COMMIT" --jq .content | base64 --decode > manifest.json
          echo "957a8044401fdea295d68f1a925d7bd1ecddfa2b96e608f3ef9d2d94b299017b  SPM-Browser-19.9.1.apk" | sha256sum --check
          python3 -c 'import json,base64,time; p=json.loads(base64.b64decode(json.load(open("manifest.json"))["payload"])); assert p["expiresAt"] > time.time()*1000; assert p["apkSize"] == 3259945'
      - name: Publish exact signed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v19.9.1 >/dev/null 2>&1; then
            gh release upload v19.9.1 SPM-Browser-19.9.1.apk manifest.json --clobber
          else
            gh release create v19.9.1 SPM-Browser-19.9.1.apk manifest.json --title "SPM Browser 19.9.1 — mobile update downloads" --notes "Automatic update downloads over WLAN and mobile data, with WLAN-only and off modes available. Device background behavior still requires verification." --latest
          fi
      - name: Verify anonymous public update downloads
        run: |
          curl --fail --location --retry 5 --retry-delay 3 "https://github.com/lintopino-dotcom/SPM-Browser-Updates/releases/latest/download/manifest.json" -o public-manifest.json
          cmp manifest.json public-manifest.json
          curl --fail --location --retry 5 --retry-delay 3 "https://github.com/lintopino-dotcom/SPM-Browser-Updates/releases/download/v19.9.1/SPM-Browser-19.9.1.apk" -o public.apk
          echo "957a8044401fdea295d68f1a925d7bd1ecddfa2b96e608f3ef9d2d94b299017b  public.apk" | sha256sum --check
