name: Publish signed browser update
on:
  push:
    branches: [main]
    paths: ['releases/19.10.0/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and verify approved signed release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir payload
          for i in 0 1; do
            gh api "repos/$REPO/contents/releases/19.10.0/part-$i?ref=$COMMIT" --jq .content | base64 --decode > "payload/part-$i"
          done
          cat payload/part-{0,1} > release.json
          gh api "repos/$REPO/contents/releases/assemble-19.10.0.py?ref=$COMMIT" --jq .content | base64 --decode > assemble.py
          python3 assemble.py
          echo '' | base64 --decode > public.der
          openssl pkey -pubin -inform DER -in public.der -out public.pem
          openssl dgst -sha256 -verify public.pem -signature manifest.sig manifest.payload
      - name: Publish exact signed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v19.10.0 >/dev/null 2>&1; then
            gh release upload v19.10.0 SPM-Browser-19.10.0.apk manifest.json --clobber
          else
            gh release create v19.10.0 SPM-Browser-19.10.0.apk manifest.json --title "SPM Browser 19.10.0 – Konsolensammlung" --notes "Detailreiche Hüllen und Rücken, neue Cover bis 1280 Pixel, sieben Konsolenillustrationen im Browserkopf und stumme Medien-Einlegeanimationen. Überspringen und reduzierte Bewegung unterstützt. Netzwerk-Werbefilter und Sicherheitsupdates bleiben erhalten. Oberfläche, Build und Signatur geprüft; Xperia-Gerätetest steht aus." --latest
          fi
      - name: Verify anonymous public downloads
        run: |
          curl --fail --location --retry 5 --retry-delay 3 "https://github.com/lintopino-dotcom/SPM-Browser-Updates/releases/latest/download/manifest.json" -o public-manifest.json
          cmp manifest.json public-manifest.json
          curl --fail --location --retry 5 --retry-delay 3 "https://github.com/lintopino-dotcom/SPM-Browser-Updates/releases/download/v19.10.0/SPM-Browser-19.10.0.apk" -o public.apk
          echo "cfdd90e41078a9c7307cc36ea54c9bf719c5d98f3eb6daf899b8a9fc6d008163  public.apk" | sha256sum --check
