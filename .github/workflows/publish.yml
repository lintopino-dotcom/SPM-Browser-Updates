name: Publish signed browser update
on:
  push:
    branches: [main]
    paths: ['releases/19.9.2/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble and verify approved signed release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir payload
          for i in 0 1 2 3 4; do
            gh api "repos/$REPO/contents/releases/19.9.2/part-$i?ref=$COMMIT" --jq .content | base64 --decode > "payload/part-$i"
          done
          cat payload/part-{0,1,2,3,4} > release.json
          gh api "repos/$REPO/contents/releases/assemble.py?ref=$COMMIT" --jq .content | base64 --decode > assemble.py
          python3 assemble.py
          echo '' | base64 --decode > public.der
          openssl pkey -pubin -inform DER -in public.der -out public.pem
          openssl dgst -sha256 -verify public.pem -signature manifest.sig manifest.payload
      - name: Publish exact signed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v19.9.2 >/dev/null 2>&1; then
            gh release upload v19.9.2 SPM-Browser-19.9.2.apk manifest.json --clobber
          else
            gh release create v19.9.2 SPM-Browser-19.9.2.apk manifest.json --title "SPM Browser 19.9.2 – Seitenhilfe" --notes "Schonende Darstellung für ChatGPT, Anmelde-Cookies pro Website und native Hilfe bei Ladefehlern. Netzwerk-Werbefilter werden nicht automatisch abgeschaltet. Build und Signatur geprüft; der konkrete ChatGPT-Login auf Xperia ist noch zu testen." --latest
          fi
      - name: Verify anonymous public downloads
        run: |
          curl --fail --location --retry 5 --retry-delay 3 "https://github.com/lintopino-dotcom/SPM-Browser-Updates/releases/latest/download/manifest.json" -o public-manifest.json
          cmp manifest.json public-manifest.json
          curl --fail --location --retry 5 --retry-delay 3 "https://github.com/lintopino-dotcom/SPM-Browser-Updates/releases/download/v19.9.2/SPM-Browser-19.9.2.apk" -o public.apk
          echo "8d6bed408e7529cbe30ec3f3ddc0081178dbcb2b6e861a2dde8fb9936e09c354  public.apk" | sha256sum --check
